{% extends "base.html" %}
{% block title %}{{ title }} · CareerOS{% endblock %}
{% block content %}
<section class="error-page" data-testid="error-page">
  <p class="muted">Error {{ code }}</p>
  <h1>{{ title }}</h1>
  {% if detail %}<p data-testid="error-detail">{{ detail }}</p>{% endif %}
  {% if hint %}<p class="muted">{{ hint }}</p>{% endif %}
  <div class="actions">
    {% if back %}<a href="{{ back }}">Go back</a>{% endif %}
    <a href="/">Overview</a>
    <a href="/jobs">Jobs</a>
  </div>
</section>
{% endblock %}
