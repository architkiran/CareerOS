# CareerOS source watchlist.
#
# Docker: copy to config/sources.toml and restart (`docker compose up -d`); it syncs on start.
# Without Docker: `careeros sources sync`, then `careeros ingest`.
#
# Only public ATS job-board APIs: greenhouse, lever, ashby. `token` is the board name in the
# public jobs URL: boards.greenhouse.io/<token>, jobs.lever.co/<token>, jobs.ashbyhq.com/<token>.
# Sync adds missing sources and disables ones marked `enabled = false`; it never re-enables
# a source you turned off in the dashboard.
#
# Every board below was checked against its public API on 2026-11-03. Boards move: a 404 on
# the Sources page means the company changed providers.
#
# Not here because they don't publish a public Greenhouse/Lever/Ashby board (they use Workday
# or their own sites, which CareerOS doesn't scrape): State Street, Fidelity, Wellington,
# McKinsey, KPMG, Deloitte, Bain, Bloomberg, Wise, Amazon, Microsoft, Google, Meta.

